name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate open Agent Skills contract
        run: agentskills validate skills/collision-free-agentic-development
      - name: Run every pre-commit gate
        run: pre-commit run --all-files

  compose-smoke:
    name: Render Compose templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Scaffold and render each data/TLS mode
        run: python tests/smoke_compose.py
      - name: Build and run rootless Node template
        run: python tests/smoke_node_runtime.py
      - name: Run per-worktree PostgreSQL and Redis profile
        run: python tests/smoke_data_runtime.py
